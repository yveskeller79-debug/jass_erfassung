<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jass Export</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --felt-0:#0c1f16; --felt-1:#123626; --felt-2:#1a4a33;
    --gold:#c9a24b; --gold-bright:#e6c468; --cream:#f3ead2; --cream-dim:#c9c0a8;
    --red:#8c3a3a; --line: rgba(230,196,104,0.18); --radius: 10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at top, var(--felt-2) 0%, var(--felt-0) 65%);
    color:var(--cream); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:40px;
  }
  h1,h2{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 60px;}
  header.top{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  header.top h1{font-size:1.4rem;color:var(--gold-bright);}
  .card{background:linear-gradient(180deg, var(--felt-1), var(--felt-0));border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .card h2{font-size:1.05rem;color:var(--gold-bright);margin-bottom:12px;}
  .evening-item{display:flex;justify-content:space-between;align-items:center;padding:12px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;}
  .evening-item:active{background:var(--felt-2);}
  .evening-item .date{font-weight:600;}
  .evening-item .teams{font-size:0.8rem;color:var(--cream-dim);}
  input[type=password]{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--felt-0);color:var(--cream);font-size:1rem;text-align:center;letter-spacing:2px;}
  button.primary{width:100%;padding:14px;border:none;border-radius:9px;background:var(--gold);color:#1a1305;font-weight:700;font-size:1rem;cursor:pointer;margin-top:14px;font-family:'Inter',sans-serif;}
  .hint{font-size:0.8rem;color:var(--cream-dim);margin-top:8px;}
  #lockError{color:var(--red);font-size:0.85rem;margin-top:10px;min-height:1.2em;}
  #screen-list, #screen-lock{display:none;}
  #screen-lock .card{max-width:340px;margin:18vh auto 0;text-align:center;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1305;padding:10px 18px;border-radius:20px;font-weight:600;font-size:0.85rem;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>🂡 Jass Export</h1></header>

  <div id="screen-lock">
    <div class="card">
      <h2 style="margin-bottom:14px;">Zugang</h2>
      <input type="password" id="lockInput" placeholder="Passwort" autocomplete="off">
      <div id="lockError"></div>
      <button class="primary" id="lockBtn">Entsperren</button>
    </div>
  </div>

  <div id="screen-list">
    <div class="card">
      <h2>Jahresstatistik</h2>
      <button class="primary" id="yearStatsBtn">Jahresstatistik generieren</button>
      <div class="hint">Berechnet die komplette Saison-Rangliste (alle Kategorien + Pokale) aus allen bisher erfassten Abenden.</div>
    </div>
    <div class="card">
      <h2>Abend auswählen</h2>
      <div id="eveningList"></div>
      <div class="hint">Antippen, um den Einzelabend-Export für diesen Abend herunterzuladen.</div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL = "https://nkdpkjozdpnzydghskhf.supabase.co";
const SUPABASE_KEY = "sb_publishable_jrPABltYQQnyQWvz5pmRXw_qM6uuPrS";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PASSWORD_HASH = "c1fbdd1f9a3009616a8a518c0c1a7eb0eba5ef2eb1b956accaff0af227e2828e";
const LOCK_STORAGE_KEY = "jass_unlocked";

const TRUMPS = ["Eichel","Schelle","Schilten","Rosen","Une-ufe","Obe-abe"];
const MULT = { Eichel:1, Schelle:2, Schilten:2, Rosen:4, "Une-ufe":3, "Obe-abe":3 };
const MATCH_BASE = 257;
const WEIS_SIZES = [20,50,100,150,200];

const $ = sel => document.querySelector(sel);

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function checkLock(){
  if (localStorage.getItem(LOCK_STORAGE_KEY) === PASSWORD_HASH){
    $('#screen-lock').style.display = 'none';
    return true;
  }
  $('#screen-lock').style.display = 'block';
  return false;
}
$('#lockBtn').onclick = async ()=>{
  const val = $('#lockInput').value;
  const hash = await sha256Hex(val);
  if (hash === PASSWORD_HASH){
    localStorage.setItem(LOCK_STORAGE_KEY, hash);
    $('#screen-lock').style.display = 'none';
    init();
  } else {
    $('#lockError').textContent = 'Falsches Passwort.';
  }
};
$('#lockInput').addEventListener('keydown', e=>{ if (e.key==='Enter') $('#lockBtn').click(); });

let players = [];
function playerName(id){ const p = players.find(p=>p.id===id); return p ? p.name : '?'; }

function excelDateSerial(dateStr){
  // dateStr = 'YYYY-MM-DD'
  const d = new Date(dateStr + 'T00:00:00Z');
  const epoch = Date.UTC(1899,11,30);
  return Math.round((d.getTime() - epoch) / 86400000);
}

async function init(){
  $('#screen-list').style.display = 'block';
  const { data: pl, error: plErr } = await sb.from('players').select('*').order('id');
  if (plErr){ toast('Fehler beim Laden der Spieler'); console.error(plErr); return; }
  players = pl;

  const { data: evenings, error } = await sb.from('evenings').select('*').order('date', {ascending:false});
  if (error){ toast('Fehler beim Laden der Abende'); console.error(error); return; }

  const wrap = $('#eveningList');
  wrap.innerHTML = '';
  if (evenings.length === 0){
    wrap.innerHTML = '<div class="hint">Noch keine Abende erfasst.</div>';
    return;
  }
  evenings.forEach(ev=>{
    const item = document.createElement('div');
    item.className = 'evening-item';
    const t1 = `${playerName(ev.team1_player1)} & ${playerName(ev.team1_player2)}`;
    const t2 = `${playerName(ev.team2_player1)} & ${playerName(ev.team2_player2)}`;
    item.innerHTML = `<div><div class="date">${ev.date}</div><div class="teams">${t1} vs ${t2}</div></div><div>↓</div>`;
    item.onclick = ()=>generateEinzelabend(ev);
    wrap.appendChild(item);
  });
}

$('#yearStatsBtn').onclick = generateJahresstatistik;

async function generateJahresstatistik(){
  toast('Lade Saison-Daten…');
  const [evR, roundsR, trumpR, weisR, eventsR, jfkR] = await Promise.all([
    sb.from('evenings').select('*'),
    sb.from('rounds').select('*'),
    sb.from('trump_decisions').select('*'),
    sb.from('weis').select('*'),
    sb.from('team_events').select('*'),
    sb.from('jfk').select('*')
  ]);
  const firstError = [evR, roundsR, trumpR, weisR, eventsR, jfkR].find(r=>r.error);
  if (firstError){ toast('Fehler beim Laden der Saison-Daten'); console.error(firstError.error); return; }

  const evenings = evR.data.sort((a,b)=> a.date < b.date ? -1 : 1);
  const rounds = roundsR.data, trump = trumpR.data, weis = weisR.data, events = eventsR.data, jfk = jfkR.data;

  if (evenings.length === 0){ toast('Noch keine Abende vorhanden.'); return; }

  const evById = {}; evenings.forEach(ev=>{ evById[ev.id] = ev; });
  function teamOfPlayerInEvening(ev, pid){
    if (ev.team1_player1===pid || ev.team1_player2===pid) return 1;
    if (ev.team2_player1===pid || ev.team2_player2===pid) return 2;
    return null;
  }
  const roundsByEvening = {};
  rounds.forEach(r=>{ (roundsByEvening[r.evening_id] = roundsByEvening[r.evening_id]||[]).push(r); });
  const eventsByEvening = {};
  events.forEach(e=>{ (eventsByEvening[e.evening_id] = eventsByEvening[e.evening_id]||[]).push(e); });

  const MULT_TIER = { Eichel:1, Schelle:2, Schilten:2, Rosen:4, 'Une-ufe':3, 'Obe-abe':3 };

  // ---- reusable aggregation: given a subset of evenings (chronological prefix or all),
  // compute the same per-player stats object used everywhere else. ----
  function computeStats(evSubset){
    const evIds = new Set(evSubset.map(e=>e.id));
    const P = {};
    players.forEach(p=>{ P[p.id] = {
      id:p.id, name:p.name,
      vhCount:0, totalTurns:0,
      totalStriche:0, totalBerg:0, totalSchneider:0, totalKontermatch:0,
      totalPunkte:0, totalRounds:0,
      totalMatchCount:0, totalMatchPoints:0,
      matchByTier:{1:0,2:0,3:0,4:0},
      totalWeisPoints:0,
      weisCountBySize:{20:0,50:0,100:0,150:0,200:0},
      weisPointsBySize:{20:0,50:0,100:0,150:0,200:0},
      tagessiege:0, teilnahmen:0,
      totalSpenden:0,
      rundensiege:0, jfkCount:0
    }; });

    trump.filter(t=>evIds.has(t.evening_id)).forEach(t=>{
      if (P[t.turn_player_id]){
        P[t.turn_player_id].totalTurns++;
        if (t.decision === 'VH') P[t.turn_player_id].vhCount++;
      }
    });

    evSubset.forEach(ev=>{
      players.forEach(p=>{ P[p.id].teilnahmen++; });
      const evRounds = roundsByEvening[ev.id] || [];
      const evEvents = eventsByEvening[ev.id] || [];
      const roundCount = evRounds.length;

      const teamStriche = {1:0,2:0}, teamBerg={1:0,2:0}, teamSchneider={1:0,2:0}, teamKonter={1:0,2:0};
      const teamMatchCount={1:0,2:0}, teamMatchPoints={1:0,2:0};
      const teamRoundsWon={1:0,2:0}, teamPunkte={1:0,2:0};
      evRounds.forEach(r=>{
        teamPunkte[1]+=r.team1_score; teamPunkte[2]+=r.team2_score;
        teamRoundsWon[r.winning_team]++;
      });
      evEvents.forEach(e=>{
        if (e.event_type==='Match'){
          teamMatchCount[e.team]++;
          teamMatchPoints[e.team] += 257*MULT_TIER[e.trump];
        } else if (e.event_type==='Berg') teamBerg[e.team]++;
        else if (e.event_type==='Schneider') teamSchneider[e.team]++;
        else if (e.event_type==='Kontermatch') teamKonter[e.team]++;
      });
      teamStriche[1] = 2*teamRoundsWon[1] + teamMatchCount[1] + teamBerg[1] + teamSchneider[1] + teamKonter[1];
      teamStriche[2] = 2*teamRoundsWon[2] + teamMatchCount[2] + teamBerg[2] + teamSchneider[2] + teamKonter[2];

      const stricheDiff = teamStriche[1] - teamStriche[2];
      const spendePerPlayer = {1:0,2:0};
      if (stricheDiff < 0) spendePerPlayer[1] = -stricheDiff*10;
      else if (stricheDiff > 0) spendePerPlayer[2] = stricheDiff*10;

      let dayWinner = null;
      if (teamStriche[1] > teamStriche[2]) dayWinner = 1;
      else if (teamStriche[2] > teamStriche[1]) dayWinner = 2;
      else dayWinner = 'tie';

      [[ev.team1_player1,1],[ev.team1_player2,1],[ev.team2_player1,2],[ev.team2_player2,2]].forEach(([pid,team])=>{
        const p = P[pid]; if (!p) return;
        p.totalStriche += teamStriche[team];
        p.totalBerg += teamBerg[team];
        p.totalSchneider += teamSchneider[team];
        p.totalKontermatch += teamKonter[team];
        p.totalPunkte += teamPunkte[team];
        p.totalRounds += roundCount;
        p.totalMatchCount += teamMatchCount[team];
        p.totalMatchPoints += teamMatchPoints[team];
        p.rundensiege += teamRoundsWon[team];
        p.totalSpenden += spendePerPlayer[team];
        if (dayWinner === 'tie' || dayWinner === team) p.tagessiege++;
      });

      evEvents.forEach(e=>{
        if (e.event_type==='Match'){
          const tier = MULT_TIER[e.trump];
          [[ev.team1_player1,1],[ev.team1_player2,1],[ev.team2_player1,2],[ev.team2_player2,2]]
            .forEach(([pid,team])=>{ if (team===e.team && P[pid]) P[pid].matchByTier[tier]++; });
        }
      });
    });

    weis.filter(w=>evIds.has(w.evening_id)).forEach(w=>{
      const p = P[w.player_id]; if (!p) return;
      const pts = w.value * MULT_TIER[w.trump];
      p.totalWeisPoints += pts;
      p.weisCountBySize[w.value]++;
      p.weisPointsBySize[w.value] += pts;
    });

    jfk.filter(j=>evIds.has(j.evening_id)).forEach(j=>{ if (P[j.player_id]) P[j.player_id].jfkCount++; });

    return P;
  }

  // Category definitions used for BOTH the main ranking tables and the
  // "Verlauf Anz. Pokale" trend (must stay consistent with the rankTable() calls below).
  const CATEGORY_DEFS = [
    { get:p=>p.totalStriche, dir:'desc' },
    { get:p=>p.totalBerg, dir:'desc' },
    { get:p=>p.teilnahmen ? p.totalStriche/p.teilnahmen : 0, dir:'desc' },
    { get:p=>p.totalRounds ? p.totalStriche/p.totalRounds : 0, dir:'desc' },
    { get:p=>p.totalSchneider, dir:'desc' },
    { get:p=>p.totalKontermatch, dir:'desc' },
    { get:p=>p.totalPunkte, dir:'desc' },
    { get:p=>p.teilnahmen ? p.totalPunkte/p.teilnahmen : 0, dir:'desc' },
    { get:p=>p.totalRounds ? p.totalPunkte/p.totalRounds : 0, dir:'desc' },
    { get:p=>p.totalMatchCount, dir:'desc' },
    { get:p=>p.totalMatchPoints, dir:'desc' },
    { get:p=>p.matchByTier[1], dir:'desc' },
    { get:p=>p.matchByTier[2], dir:'desc' },
    { get:p=>p.matchByTier[3], dir:'desc' },
    { get:p=>p.matchByTier[4], dir:'desc' },
    { get:p=>p.totalWeisPoints, dir:'desc' },
    { get:p=>p.weisCountBySize[20], dir:'desc' },
    { get:p=>p.weisPointsBySize[20], dir:'desc' },
    { get:p=>p.weisCountBySize[50], dir:'desc' },
    { get:p=>p.weisPointsBySize[50], dir:'desc' },
    { get:p=>p.weisCountBySize[100], dir:'desc' },
    { get:p=>p.weisPointsBySize[100], dir:'desc' },
    { get:p=>p.weisCountBySize[150], dir:'desc' },
    { get:p=>p.weisPointsBySize[150], dir:'desc' },
    { get:p=>p.weisCountBySize[200], dir:'desc' },
    { get:p=>p.weisPointsBySize[200], dir:'desc' },
    { get:p=>p.tagessiege, dir:'desc' },
    { get:p=>p.teilnahmen, dir:'desc' },
    { get:p=>p.totalSpenden, dir:'asc' },
    { get:p=>p.teilnahmen ? p.totalSpenden/p.teilnahmen : 0, dir:'asc' },
    { get:p=>p.rundensiege, dir:'desc' },
    { get:p=>p.jfkCount, dir:'asc' }
  ];

  function countPokals(P){
    const totals = {}; players.forEach(p=>totals[p.id]=0);
    CATEGORY_DEFS.forEach(def=>{
      const values = players.map(p=>({id:p.id, val:def.get(P[p.id])}));
      const sorted = values.slice().sort((a,b)=> def.dir==='asc' ? a.val-b.val : b.val-a.val);
      const topVal = sorted[0].val;
      if (def.dir==='desc' && topVal <= 0) return; // nobody has achieved anything yet in this category
      sorted.forEach(entry=>{ if (entry.val === topVal) totals[entry.id]++; });
    });
    return totals;
  }

  const P = computeStats(evenings);
  const plist = players.map(p=>P[p.id]);

  // ---- ranking helper (writes one 4-row-by-4-col table into the sheet) ----
  let pokalTotals = {}; players.forEach(p=>pokalTotals[p.id]=0);

  function rankTable(ws, startRow, col, values, direction){
    // values: [{id, val}], direction: 'desc' (higher=better) or 'asc' (lower=better)
    const sorted = values.slice().sort((a,b)=> direction==='asc' ? a.val-b.val : b.val-a.val);
    const topVal = sorted[0].val;
    const noRealLeader = direction==='desc' && topVal <= 0; // nobody has achieved anything yet
    let rank = 1;
    sorted.forEach((entry, i)=>{
      if (i>0){
        const prev = sorted[i-1];
        rank = entry.val === prev.val ? rank : i+1;
      }
      const row = startRow + i;
      const isPokal = rank === 1 && !noRealLeader;
      setCell(ws, `${col}${row}`, rank);
      setCell(ws, `${String.fromCharCode(col.charCodeAt(0)+1)}${row}`, playerName(entry.id));
      setCell(ws, `${String.fromCharCode(col.charCodeAt(0)+2)}${row}`, Math.round(entry.val*1e6)/1e6);
      if (isPokal){
        setCell(ws, `${String.fromCharCode(col.charCodeAt(0)+3)}${row}`, 1);
        pokalTotals[entry.id]++;
      }
    });
  }

  const wb = XLSX.utils.book_new();
  const ws = {};
  function setCell(ws, addr, value){
    if (typeof value === 'number') ws[addr] = { t:'n', v: value };
    else ws[addr] = { t:'s', v: String(value) };
  }

  setCell(ws,'A1', `Jassstatistik Wädis – Saison`);
  setCell(ws,'F5','Gesamtwertung');
  setCell(ws,'F7','Ranking'); setCell(ws,'G7','Spieler'); setCell(ws,'H7','Anzahl Pokale'); setCell(ws,'I7','VH %');

  // Strich
  setCell(ws,'A14','Strich');
  setCell(ws,'A16','Ranking'); setCell(ws,'B16','Spieler'); setCell(ws,'C16','Total Striche'); setCell(ws,'D16','Pokal');
  setCell(ws,'F16','Ranking'); setCell(ws,'G16','Spieler'); setCell(ws,'H16','Total Berg'); setCell(ws,'I16','Pokal');
  setCell(ws,'K16','Ranking'); setCell(ws,'L16','Spieler'); setCell(ws,'M16','ø Anzahl Striche/Abend'); setCell(ws,'N16','Pokal');
  rankTable(ws,17,'A', plist.map(p=>({id:p.id,val:p.totalStriche})), 'desc');
  rankTable(ws,17,'F', plist.map(p=>({id:p.id,val:p.totalBerg})), 'desc');
  rankTable(ws,17,'K', plist.map(p=>({id:p.id,val:p.totalStriche/p.teilnahmen})), 'desc');

  setCell(ws,'A22','Ranking'); setCell(ws,'B22','Spieler'); setCell(ws,'C22','ø Anzahl Striche/Spiel'); setCell(ws,'D22','Pokal');
  setCell(ws,'F22','Ranking'); setCell(ws,'G22','Spieler'); setCell(ws,'H22','Total Schneider'); setCell(ws,'I22','Pokal');
  setCell(ws,'K22','Ranking'); setCell(ws,'L22','Spieler'); setCell(ws,'M22','Total Kontermatch'); setCell(ws,'N22','Pokal');
  rankTable(ws,23,'A', plist.map(p=>({id:p.id,val: p.totalRounds ? p.totalStriche/p.totalRounds : 0})), 'desc');
  rankTable(ws,23,'F', plist.map(p=>({id:p.id,val:p.totalSchneider})), 'desc');
  rankTable(ws,23,'K', plist.map(p=>({id:p.id,val:p.totalKontermatch})), 'desc');

  // Pünkt
  setCell(ws,'A28','Pünkt');
  setCell(ws,'A30','Ranking'); setCell(ws,'B30','Spieler'); setCell(ws,'C30','Total Punkte'); setCell(ws,'D30','Pokal');
  setCell(ws,'F30','Ranking'); setCell(ws,'G30','Spieler'); setCell(ws,'H30','ø Anzahl Punkte/Abend'); setCell(ws,'I30','Pokal');
  setCell(ws,'K30','Ranking'); setCell(ws,'L30','Spieler'); setCell(ws,'M30','ø Anzahl Punkte/Spiel'); setCell(ws,'N30','Pokal');
  rankTable(ws,31,'A', plist.map(p=>({id:p.id,val:p.totalPunkte})), 'desc');
  rankTable(ws,31,'F', plist.map(p=>({id:p.id,val:p.totalPunkte/p.teilnahmen})), 'desc');
  rankTable(ws,31,'K', plist.map(p=>({id:p.id,val: p.totalRounds ? p.totalPunkte/p.totalRounds : 0})), 'desc');

  // Mätsch
  setCell(ws,'A36','Mätsch');
  setCell(ws,'A38','Ranking'); setCell(ws,'B38','Spieler'); setCell(ws,'C38','Total Anzahl Match'); setCell(ws,'D38','Pokal');
  setCell(ws,'F38','Ranking'); setCell(ws,'G38','Spieler'); setCell(ws,'H38','Total Punkte Match*'); setCell(ws,'I38','Pokal');
  setCell(ws,'K38','Ranking'); setCell(ws,'L38','Spieler'); setCell(ws,'M38','Anzahl Match 1fach'); setCell(ws,'N38','Pokal');
  rankTable(ws,39,'A', plist.map(p=>({id:p.id,val:p.totalMatchCount})), 'desc');
  rankTable(ws,39,'F', plist.map(p=>({id:p.id,val:p.totalMatchPoints})), 'desc');
  rankTable(ws,39,'K', plist.map(p=>({id:p.id,val:p.matchByTier[1]})), 'desc');

  setCell(ws,'A44','Ranking'); setCell(ws,'B44','Spieler'); setCell(ws,'C44','Anzahl Match 2fach'); setCell(ws,'D44','Pokal');
  setCell(ws,'F44','Ranking'); setCell(ws,'G44','Spieler'); setCell(ws,'H44','Anzahl Match 3fach'); setCell(ws,'I44','Pokal');
  setCell(ws,'K44','Ranking'); setCell(ws,'L44','Spieler'); setCell(ws,'M44','Anzahl Match 4fach'); setCell(ws,'N44','Pokal');
  rankTable(ws,45,'A', plist.map(p=>({id:p.id,val:p.matchByTier[2]})), 'desc');
  rankTable(ws,45,'F', plist.map(p=>({id:p.id,val:p.matchByTier[3]})), 'desc');
  rankTable(ws,45,'K', plist.map(p=>({id:p.id,val:p.matchByTier[4]})), 'desc');

  // Wiise
  setCell(ws,'A50','Wiise');
  setCell(ws,'A52','Ranking'); setCell(ws,'B52','Spieler'); setCell(ws,'C52','Total Punkte Weisen*'); setCell(ws,'D52','Pokal');
  setCell(ws,'F52','Ranking'); setCell(ws,'G52','Spieler'); setCell(ws,'H52','Anzahl Weisen 20er'); setCell(ws,'I52','Pokal');
  setCell(ws,'K52','Ranking'); setCell(ws,'L52','Spieler'); setCell(ws,'M52','Punkte Weisen 20er*'); setCell(ws,'N52','Pokal');
  rankTable(ws,53,'A', plist.map(p=>({id:p.id,val:p.totalWeisPoints})), 'desc');
  rankTable(ws,53,'F', plist.map(p=>({id:p.id,val:p.weisCountBySize[20]})), 'desc');
  rankTable(ws,53,'K', plist.map(p=>({id:p.id,val:p.weisPointsBySize[20]})), 'desc');

  setCell(ws,'A58','Ranking'); setCell(ws,'B58','Spieler'); setCell(ws,'C58','Anzahl Weisen 50er'); setCell(ws,'D58','Pokal');
  setCell(ws,'F58','Ranking'); setCell(ws,'G58','Spieler'); setCell(ws,'H58','Punkte Weisen 50er*'); setCell(ws,'I58','Pokal');
  setCell(ws,'K58','Ranking'); setCell(ws,'L58','Spieler'); setCell(ws,'M58','Anz. Weisen 100er'); setCell(ws,'N58','Pokal');
  rankTable(ws,59,'A', plist.map(p=>({id:p.id,val:p.weisCountBySize[50]})), 'desc');
  rankTable(ws,59,'F', plist.map(p=>({id:p.id,val:p.weisPointsBySize[50]})), 'desc');
  rankTable(ws,59,'K', plist.map(p=>({id:p.id,val:p.weisCountBySize[100]})), 'desc');

  setCell(ws,'A64','Ranking'); setCell(ws,'B64','Spieler'); setCell(ws,'C64','Punkte Weisen 100er*'); setCell(ws,'D64','Pokal');
  setCell(ws,'F64','Ranking'); setCell(ws,'G64','Spieler'); setCell(ws,'H64','Anz. Weisen 150er'); setCell(ws,'I64','Pokal');
  setCell(ws,'K64','Ranking'); setCell(ws,'L64','Spieler'); setCell(ws,'M64','Punkte Weisen 150er*'); setCell(ws,'N64','Pokal');
  rankTable(ws,65,'A', plist.map(p=>({id:p.id,val:p.weisPointsBySize[100]})), 'desc');
  rankTable(ws,65,'F', plist.map(p=>({id:p.id,val:p.weisCountBySize[150]})), 'desc');
  rankTable(ws,65,'K', plist.map(p=>({id:p.id,val:p.weisPointsBySize[150]})), 'desc');

  setCell(ws,'A70','Ranking'); setCell(ws,'B70','Spieler'); setCell(ws,'C70','Anz. Weisen 200er'); setCell(ws,'D70','Pokal');
  setCell(ws,'F70','Ranking'); setCell(ws,'G70','Spieler'); setCell(ws,'H70','Punkte Weisen 200er*'); setCell(ws,'I70','Pokal');
  rankTable(ws,71,'A', plist.map(p=>({id:p.id,val:p.weisCountBySize[200]})), 'desc');
  rankTable(ws,71,'F', plist.map(p=>({id:p.id,val:p.weisPointsBySize[200]})), 'desc');
  setCell(ws,'K70','* die Punkte wurden inkl. dem Multiplikator berechnet');
  setCell(ws,'K71','Multiplikator: '); setCell(ws,'L71','Eicheln = 1fach');
  setCell(ws,'L72','Schelle/Schilten = 2fach');
  setCell(ws,'L73','Une-ufe/Obe-abe = 3fach');
  setCell(ws,'L74','Rosen = 4fach');

  // Übriges
  setCell(ws,'A76','Übriges');
  setCell(ws,'A78','Ranking'); setCell(ws,'B78','Spieler'); setCell(ws,'C78','Anz. Tagessiege'); setCell(ws,'D78','Pokal');
  setCell(ws,'F78','Ranking'); setCell(ws,'G78','Spieler'); setCell(ws,'H78','Anz. Teilnahmen'); setCell(ws,'I78','Pokal');
  setCell(ws,'K78','Ranking'); setCell(ws,'L78','Spieler'); setCell(ws,'M78','Total Spenden'); setCell(ws,'N78','Pokal');
  rankTable(ws,79,'A', plist.map(p=>({id:p.id,val:p.tagessiege})), 'desc');
  rankTable(ws,79,'F', plist.map(p=>({id:p.id,val:p.teilnahmen})), 'desc');
  rankTable(ws,79,'K', plist.map(p=>({id:p.id,val:p.totalSpenden})), 'asc');

  setCell(ws,'A84','Ranking'); setCell(ws,'B84','Spieler'); setCell(ws,'C84','ø Spende/Abend'); setCell(ws,'D84','Pokal');
  setCell(ws,'F84','Ranking'); setCell(ws,'G84','Spieler'); setCell(ws,'H84','Anz. Rundensiege'); setCell(ws,'I84','Pokal');
  setCell(ws,'K84','Ranking'); setCell(ws,'L84','Spieler'); setCell(ws,'M84','JFK'); setCell(ws,'N84','Pokal');
  rankTable(ws,85,'A', plist.map(p=>({id:p.id,val:p.totalSpenden/p.teilnahmen})), 'asc');
  rankTable(ws,85,'F', plist.map(p=>({id:p.id,val:p.rundensiege})), 'desc');
  rankTable(ws,85,'K', plist.map(p=>({id:p.id,val:p.jfkCount})), 'asc');

  // Gesamtwertung data (needs pokalTotals computed above, so filled last)
  const gwSorted = plist.map(p=>({id:p.id,val:pokalTotals[p.id]})).sort((a,b)=>b.val-a.val);
  let gwRank=1;
  gwSorted.forEach((entry,i)=>{
    if (i>0){ const prev=gwSorted[i-1]; gwRank = entry.val===prev.val ? gwRank : i+1; }
    const row=8+i;
    const p = P[entry.id];
    setCell(ws,`F${row}`, gwRank);
    setCell(ws,`G${row}`, p.name);
    setCell(ws,`H${row}`, pokalTotals[entry.id]);
    setCell(ws,`I${row}`, p.totalTurns ? p.vhCount/p.totalTurns : 0);
  });

  // ---- Teamkonstellationen (only pairs among current 4 players) ----
  setCell(ws,'K94','Teamkonstellationen');
  setCell(ws,'M94','Gesamt-Anteil'); setCell(ws,'N94','Gesamt-Anzahl');
  setCell(ws,'O94','Win-Rate'); setCell(ws,'P94','*Win-Anteil');
  const pairs = [];
  for (let i=0;i<players.length;i++) for (let j=i+1;j<players.length;j++) pairs.push([players[i], players[j]]);
  let pairRow = 95;
  pairs.forEach(([p1,p2])=>{
    let together=0, wins=0;
    evenings.forEach(ev=>{
      const t1 = teamOfPlayerInEvening(ev, p1.id);
      const t2 = teamOfPlayerInEvening(ev, p2.id);
      if (t1!=null && t1===t2){
        together++;
        const evEvents = eventsByEvening[ev.id] || [];
        const evRounds = roundsByEvening[ev.id] || [];
        const teamStriche = {1:0,2:0};
        evRounds.forEach(r=>{ teamStriche[r.winning_team]+=2; });
        evEvents.forEach(e=>{ if (['Match','Berg','Schneider','Kontermatch'].includes(e.event_type)) teamStriche[e.team]++; });
        if (teamStriche[t1] >= teamStriche[t1===1?2:1]) wins++; // tie counts as win
      }
    });
    setCell(ws, `K${pairRow}`, p1.name);
    setCell(ws, `L${pairRow}`, p2.name);
    const totalEvenings = evenings.length;
    setCell(ws, `M${pairRow}`, totalEvenings ? together/totalEvenings : 0);
    setCell(ws, `N${pairRow}`, together);
    setCell(ws, `O${pairRow}`, together ? wins/together : 0);
    setCell(ws, `P${pairRow}`, totalEvenings ? wins/totalEvenings : 0);
    pairRow++;
  });

  // ---- Anzahl Pokale ranking (small check table, as in original template) ----
  const pokaleTableRow = 110;
  setCell(ws,`A${pokaleTableRow}`,'Ranking'); setCell(ws,`B${pokaleTableRow}`,'Spieler'); setCell(ws,`C${pokaleTableRow}`,'Anzahl Pokale');
  setCell(ws,`M${pokaleTableRow}`,'* Unentschieden wird als Sieg gewertet');
  const gwSorted2 = plist.map(p=>({id:p.id,val:pokalTotals[p.id]})).sort((a,b)=>b.val-a.val);
  let gwRank2=1;
  gwSorted2.forEach((entry,i)=>{
    if (i>0){ const prev=gwSorted2[i-1]; gwRank2 = entry.val===prev.val ? gwRank2 : i+1; }
    const row = pokaleTableRow+1+i;
    setCell(ws,`A${row}`, gwRank2);
    setCell(ws,`B${row}`, P[entry.id].name);
    setCell(ws,`C${row}`, entry.val);
  });

  // ---- Verlauf Tagessiege (row 120 header, 122 = evening index 1..N, 123.. = one row per player) ----
  setCell(ws,'A120','Verlauf Tagessiege');
  evenings.forEach((ev,i)=>{ setCell(ws, `${XLSX.utils.encode_col(1+i)}122`, i+1); });
  const dayResultByPlayer = {}; players.forEach(p=>dayResultByPlayer[p.id]=[]);
  evenings.forEach(ev=>{
    const evEvents = eventsByEvening[ev.id] || [];
    const evRounds = roundsByEvening[ev.id] || [];
    const teamStriche = {1:0,2:0};
    evRounds.forEach(r=>{ teamStriche[r.winning_team] += 2; });
    evEvents.forEach(e=>{
      if (['Match','Berg','Schneider','Kontermatch'].includes(e.event_type)) teamStriche[e.team]++;
    });
    let result;
    if (teamStriche[1] > teamStriche[2]) result = {1:1,2:-1};
    else if (teamStriche[2] > teamStriche[1]) result = {1:-1,2:1};
    else result = {1:0,2:0};
    [[ev.team1_player1,1],[ev.team1_player2,1],[ev.team2_player1,2],[ev.team2_player2,2]].forEach(([pid,team])=>{
      dayResultByPlayer[pid].push(result[team]);
    });
  });
  players.forEach((p,i)=>{
    const row = 123 + i;
    setCell(ws,`A${row}`, p.name);
    dayResultByPlayer[p.id].forEach((val, ci)=>{
      setCell(ws, `${XLSX.utils.encode_col(1+ci)}${row}`, val);
    });
  });

  // ---- Verlauf Anz. Pokale (row 129 header, 131 = evening date labels, 132.. = cumulative pokal count per player) ----
  setCell(ws,'A129','Verlauf Anz. Pokale:');
  evenings.forEach((ev,i)=>{
    const [y,m,d] = ev.date.split('-');
    setCell(ws, `${XLSX.utils.encode_col(1+i)}131`, `${d}.${m}.`);
  });
  const cumulativePokalByPlayer = {}; players.forEach(p=>cumulativePokalByPlayer[p.id]=[]);
  evenings.forEach((ev,i)=>{
    const prefix = evenings.slice(0, i+1);
    const Pcut = computeStats(prefix);
    const totalsCut = countPokals(Pcut);
    players.forEach(p=>{ cumulativePokalByPlayer[p.id].push(totalsCut[p.id]); });
  });
  players.forEach((p,i)=>{
    const row = 132 + i;
    setCell(ws,`A${row}`, p.name);
    cumulativePokalByPlayer[p.id].forEach((val, ci)=>{
      setCell(ws, `${XLSX.utils.encode_col(1+ci)}${row}`, val);
    });
  });

  let maxRow = 135 + 2;
  let maxCol = Math.max(30, 1+evenings.length);
  ws['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:maxRow, c:maxCol} });
  wb.SheetNames.push('Gesamtranking Print');
  wb.Sheets['Gesamtranking Print'] = ws;
  XLSX.writeFile(wb, 'Statistik_Jassen.xlsx');
  toast('Jahresstatistik erstellt');
}

async function generateEinzelabend(evening){
  toast('Lade Daten…');
  const evId = evening.id;
  const [roundsR, trumpR, weisR, eventsR, jfkR] = await Promise.all([
    sb.from('rounds').select('*').eq('evening_id', evId).order('round_number'),
    sb.from('trump_decisions').select('*').eq('evening_id', evId),
    sb.from('weis').select('*').eq('evening_id', evId),
    sb.from('team_events').select('*').eq('evening_id', evId),
    sb.from('jfk').select('*').eq('evening_id', evId)
  ]);
  const firstError = [roundsR, trumpR, weisR, eventsR, jfkR].find(r=>r.error);
  if (firstError){ toast('Fehler beim Laden der Abenddaten'); console.error(firstError.error); return; }

  const rounds = roundsR.data, trump = trumpR.data, weis = weisR.data, events = eventsR.data, jfk = jfkR.data;

  const orderedPlayers = [
    evening.team1_player1, evening.team1_player2,
    evening.team2_player1, evening.team2_player2
  ];
  const rowLabels = ['Team 1','Team 1.1','Team 2','Team 2.1'];
  const teamOfPlayer = {};
  teamOfPlayer[evening.team1_player1] = 1;
  teamOfPlayer[evening.team1_player2] = 1;
  teamOfPlayer[evening.team2_player1] = 2;
  teamOfPlayer[evening.team2_player2] = 2;

  // ---- per player aggregates ----
  function vhPercent(pid){
    const turns = trump.filter(t=>t.turn_player_id===pid);
    if (turns.length===0) return 0;
    const vh = turns.filter(t=>t.decision==='VH').length;
    return vh / turns.length;
  }
  function trumpCountsForPlayer(pid){
    const out = {};
    TRUMPS.forEach(tr=>{ out[tr] = trump.filter(t=>t.trump_player_id===pid && t.trump===tr).length; });
    return out;
  }
  function weisCountsForPlayer(pid){
    const out = {};
    TRUMPS.forEach(tr=>{ out[tr] = weis.filter(w=>w.player_id===pid && w.trump===tr).length; });
    return out;
  }
  function weisPointsForPlayer(pid){
    const out = {}; let sum = 0;
    TRUMPS.forEach(tr=>{
      const rawSum = weis.filter(w=>w.player_id===pid && w.trump===tr).reduce((a,w)=>a+w.value,0);
      const pts = rawSum * MULT[tr];
      out[tr] = pts; sum += pts;
    });
    out._sum = sum;
    return out;
  }
  function wiisPerPlayer(pid){ return weisPointsForPlayer(pid)._sum; }

  // ---- per team aggregates ----
  function matchCount(team){ return events.filter(e=>e.event_type==='Match' && e.team===team).length; }
  function matchPointsTotal(team){
    return events.filter(e=>e.event_type==='Match' && e.team===team)
      .reduce((a,e)=>a + MATCH_BASE*MULT[e.trump], 0);
  }
  function eventCount(team, type){ return events.filter(e=>e.event_type===type && e.team===team).length; }
  function roundsWon(team){ return rounds.filter(r=>r.winning_team===team).length; }
  function teamStriche(team){
    return 2*roundsWon(team) + matchCount(team) + eventCount(team,'Berg') + eventCount(team,'Schneider') + eventCount(team,'Kontermatch');
  }
  function teamPunkte(team){
    const key = team===1 ? 'team1_score' : 'team2_score';
    return rounds.reduce((a,r)=>a+r[key],0);
  }
  function weisByTeamAndSize(team, size){
    const teamPlayers = orderedPlayers.filter(p=>teamOfPlayer[p]===team);
    const entries = weis.filter(w=>teamPlayers.includes(w.player_id) && w.value===size);
    const count = entries.length;
    const points = entries.reduce((a,w)=>a + w.value*MULT[w.trump], 0);
    return { count, points };
  }
  function weisTotalTeam(team){
    let count=0, points=0;
    WEIS_SIZES.forEach(sz=>{ const r = weisByTeamAndSize(team, sz); count+=r.count; points+=r.points; });
    return { count, points };
  }
  function jfkCountForPlayer(pid){ return jfk.filter(j=>j.player_id===pid).length; }

  // ---- build workbook ----
  const wb = XLSX.utils.book_new();
  const ws = {};
  const setCell = (addr, value) => {
    if (value instanceof Date){
      ws[addr] = { t:'d', v: value, z:'dd.mm.yyyy' };
    } else if (typeof value === 'number'){
      ws[addr] = { t:'n', v: value };
    } else {
      ws[addr] = { t:'s', v: String(value) };
    }
  };

  const dateSerial = excelDateSerial(evening.date);

  setCell('A1','Übersicht Jassabend');
  setCell('A3','Datum:');
  setCell('C3', new Date(evening.date + 'T00:00:00Z'));

  setCell('F4','Vorhand/Rückhand');
  setCell('M4','Weisen');
  setCell('C5','Player'); setCell('D5','Vorhand %'); setCell('E5','Wiis p.P.');
  setCell('F5','Eichle'); setCell('G5','Schelle'); setCell('H5','Schilten');
  setCell('I5','Rose'); setCell('J5','Une'); setCell('K5','Obe');
  setCell('M5','Eichlen'); setCell('N5','Schelle'); setCell('O5','Schilten');
  setCell('P5','Rose'); setCell('Q5','Une'); setCell('R5','Obe');

  const trumpColOrder = ['Eichel','Schelle','Schilten','Rosen','Une-ufe','Obe-abe'];
  const colsFK = ['F','G','H','I','J','K'];
  const colsMR = ['M','N','O','P','Q','R'];

  orderedPlayers.forEach((pid, idx)=>{
    const row = 6+idx;
    setCell(`A${row}`, rowLabels[idx]);
    setCell(`B${row}`, `${dateSerial}${rowLabels[idx]}`);
    setCell(`C${row}`, playerName(pid));
    setCell(`D${row}`, vhPercent(pid));
    setCell(`E${row}`, wiisPerPlayer(pid));
    const tc = trumpCountsForPlayer(pid);
    const wc = weisCountsForPlayer(pid);
    trumpColOrder.forEach((tr,i)=>{
      setCell(`${colsFK[i]}${row}`, tc[tr]);
      setCell(`${colsMR[i]}${row}`, wc[tr]);
    });
  });

  setCell('M13','Weisen');
  setCell('M14','Eichlen'); setCell('N14','Schelle'); setCell('O14','Schilten');
  setCell('P14','Rose'); setCell('Q14','Une'); setCell('R14','Obe'); setCell('S14','Summe');

  setCell('C16','Team 1'); setCell('E16','Team 2'); setCell('H16','Differenz');

  orderedPlayers.forEach((pid, idx)=>{
    const row = 15+idx;
    setCell(`L${row}`, playerName(pid));
    const wp = weisPointsForPlayer(pid);
    trumpColOrder.forEach((tr,i)=>{ setCell(`${colsMR[i]}${row}`, wp[tr]); });
    setCell(`S${row}`, wp._sum);
  });

  const striche1 = teamStriche(1), striche2 = teamStriche(2);
  setCell('A17','Striche'); setCell('C17', striche1); setCell('E17', striche2); setCell('H17', striche1-striche2);

  setCell('C19','Anzahl'); setCell('D19','Punkte'); setCell('E19','Anzahl'); setCell('F19','Punkte'); setCell('H19','Differenz');

  const mc1 = matchCount(1), mc2 = matchCount(2);
  const mp1 = matchPointsTotal(1), mp2 = matchPointsTotal(2);
  setCell('A20','Mätsch');
  setCell('C20', mc1); setCell('D20', mp1); setCell('E20', mc2); setCell('F20', mp2);
  setCell('H20', mc1-mc2); setCell('I20', mp1-mp2);

  const bc1 = eventCount(1,'Berg'), bc2 = eventCount(2,'Berg');
  setCell('A21','Berg'); setCell('C21', bc1); setCell('E21', bc2); setCell('H21', bc1-bc2);

  const p1 = teamPunkte(1), p2 = teamPunkte(2);
  setCell('A23','Pünkt'); setCell('C23', p1); setCell('E23', p2); setCell('H23', p1-p2);

  for (let i=0;i<6;i++){
    const row = 24+i;
    const r = rounds[i];
    const t1 = r ? r.team1_score : 0;
    const t2 = r ? r.team2_score : 0;
    setCell(`A${row}`, `Runde ${i+1}`);
    setCell(`C${row}`, t1); setCell(`E${row}`, t2); setCell(`H${row}`, t1-t2);
  }
  if (rounds.length > 6){
    console.warn(`Abend hat ${rounds.length} Runden, Vorlage zeigt nur 6 – weitere Runden fehlen im Export.`);
  }

  setCell('C31','Anzahl'); setCell('D31','Punkte'); setCell('E31','Anzahl'); setCell('F31','Punkte'); setCell('H31','Differenz');

  orderedPlayers.forEach((pid, idx)=>{
    const row = 31+idx;
    setCell(`K${row}`, playerName(pid));
    setCell(`L${row}`, jfkCountForPlayer(pid));
  });

  const totalW1 = weisTotalTeam(1), totalW2 = weisTotalTeam(2);
  setCell('A32','Total Wiise');
  setCell('C32', totalW1.count); setCell('D32', totalW1.points);
  setCell('E32', totalW2.count); setCell('F32', totalW2.points);
  setCell('H32', totalW1.count-totalW2.count); setCell('I32', totalW1.points-totalW2.points);

  const sizeLabels = {20:'20er',50:'50er',100:'100er',150:'150er',200:'200er'};
  WEIS_SIZES.forEach((size, i)=>{
    const row = 33+i;
    const w1 = weisByTeamAndSize(1, size), w2 = weisByTeamAndSize(2, size);
    setCell(`A${row}`, sizeLabels[size]);
    setCell(`C${row}`, w1.count); setCell(`D${row}`, w1.points);
    setCell(`E${row}`, w2.count); setCell(`F${row}`, w2.points);
    setCell(`H${row}`, w1.count-w2.count); setCell(`I${row}`, w1.points-w2.points);
  });

  const ratio1 = p1 !== 0 ? totalW1.points/p1 : 0;
  const ratio2 = p2 !== 0 ? totalW2.points/p2 : 0;
  const relDiff = ratio2 !== 0 ? (ratio1/ratio2 - 1) : 0;
  setCell('A38','Anteil Wiise an Total');
  setCell('C38', ratio1); setCell('E38', ratio2); setCell('H38', relDiff);

  let spende1 = 0, spende2 = 0;
  if (striche1 < striche2) spende1 = (striche2-striche1)*20;
  else if (striche2 < striche1) spende2 = (striche1-striche2)*20;
  setCell('A40','Total Spenden');
  setCell('C40', spende1); setCell('E40', spende2); setCell('H40', spende1-spende2);

  // determine used range
  let maxRow = 40, maxCol = 18; // S = col 19 (0-indexed 18)
  ws['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:maxRow, c:maxCol} });

  wb.SheetNames.push('Einzelabend');
  wb.Sheets['Einzelabend'] = ws;

  const [y,m,d] = evening.date.split('-');
  const filename = `Einzelabend_${d}_${m}_${y}.xlsx`;
  XLSX.writeFile(wb, filename);
  toast('Export erstellt: ' + filename);
}

checkLock().then(unlocked => { if (unlocked) init(); });
</script>
